<!doctype html>
<html lang="vi">
  <body style="margin:0;padding:24px;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2933;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background-color:#ffffff;border-radius:12px;border:1px solid #e4e7eb;">
      <tr>
        <td style="padding:20px 24px;border-bottom:1px solid #e4e7eb;">
          <span style="font-size:17px;font-weight:700;color:#1f2933;">{{ heading }}</span>
        </td>
      </tr>
      <tr>
        <td style="padding:24px;">
{% block body %}{% endblock %}
        </td>
      </tr>
      <tr>
        <td style="padding:16px 24px;border-top:1px solid #e4e7eb;">
          <span style="font-size:12px;color:#7b8794;">{{ labels.footer }}</span>
        </td>
      </tr>
    </table>
  </body>
</html>
