{% extends "base.html" %}
{% block body %}
          <!-- Success icon -->
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td align="center" style="padding-bottom:20px;">
                <div style="display:inline-block;width:56px;height:56px;line-height:56px;text-align:center;background-color:#f0fdf4;border-radius:50%;font-size:28px;">✓</div>
              </td>
            </tr>
            <tr>
              <td align="center">
                <p style="margin:0 0 8px;font-size:18px;font-weight:700;color:#111827;line-height:1.4;">{{ event.title }}</p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;max-width:380px;">{{ labels.test_body }}</p>
              </td>
            </tr>
          </table>
{% endblock %}
